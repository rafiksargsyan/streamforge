services:
  worker:
    image: rsargsyan/streamforge-worker:latest
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "minio.local:host-gateway"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgers}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VIRTUAL_HOST: ${RABBITMQ_VIRTUAL_HOST}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-streamforge-queue}
      RABBITMQ_TOPIC_EXCHANGE_NAME: ${RABBITMQ_TOPIC_EXCHANGE_NAME:-streamforge-exchange}
      RABBITMQ_ROUTING_KEY: ${RABBITMQ_ROUTING_KEY:-streamforge-jobs}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT}
      JOB_MAX_VIDEO_FILE_SIZE_BYTES: ${JOB_MAX_VIDEO_FILE_SIZE_BYTES:-53687091200}
      FFMPEG_THREADS: ${FFMPEG_THREADS:-6}
      JOB_PROCESSING_POOL_SIZE: ${JOB_PROCESSING_POOL_SIZE:-1}
      JOB_S3_EXPIRY_SECONDS: ${JOB_S3_EXPIRY_SECONDS:-86400}
      JOB_RETENTION_SECONDS: ${JOB_RETENTION_SECONDS:-604800}
      S3_BUCKET: ${S3_BUCKET:-streamforge}

